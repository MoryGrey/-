<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Дайвинчик — поиск</title>
	<link rel="stylesheet" href="/styles.css">
	<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
	<div class="container">
		<header>
			<h1>Поиск партнёра</h1>
		</header>
		<section id="me" class="card">
			<h2>Моя анкета</h2>
			<div id="me-content">Загрузка...</div>
		</section>
		<section id="candidate" class="card">
			<h2>Кандидат</h2>
			<div id="candidate-content">Загрузка...</div>
			<div class="actions">
				<button id="dislike" class="btn btn-secondary">❌ Дизлайк</button>
				<button id="like" class="btn btn-primary">❤️ Симпатия</button>
			</div>
		</section>
	</div>
	<script src="/app.js"></script>
</body>
</html>
